<!DOCTYPE html>
<html lang="en">

    <div id="main">

        <div id="par1">

                <img src="./interactive-card-details-form-main/images/bg-card-back.png" alt="" id="img2">
                <img src="./interactive-card-details-form-main/images/card-logo.svg" alt="" id="img3">

                <p id="p2">JANE APPLESEED</p>

        </div>

            <div id="child1">

                    </div>

                    <label for="num" class="pp1">Card number</label>
                    <input type="number" id="num" placeholder="e.g 1234 5678 9123 0000 ">

                    <div>

                        <input type="date" name="" id="yy" placeholder="YY">

                    <div>
                        <label for="cvc" class="pp1">CVC</label>

    </div>
